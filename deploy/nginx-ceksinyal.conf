# Replace __APP_DIR__ with /root/ceksinyal.id or another project directory
server { listen 80; server_name ceksinyal.id www.ceksinyal.id api.ceksinyal.id; root __APP_DIR__/public; index index.php; client_max_body_size 20m; location / { try_files $uri $uri/ /index.php?$query_string; } location ~ \.php$ { include snippets/fastcgi-php.conf; fastcgi_pass unix:/run/php/php8.2-fpm.sock; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; } location ~ /\. { deny all; } }
